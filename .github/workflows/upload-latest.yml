name: Upload Latest Code Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack source (no node_modules / .next / db)
        run: |
          mkdir -p /tmp/pack
          tar -czf /tmp/pack/dip-enterprise-latest.tgz \
            --exclude=./node_modules \
            --exclude=./.next \
            --exclude=./prisma/*.db \
            --exclude=./prisma/*.db-journal \
            --exclude=./.env \
            --exclude=./.git \
            .
          ls -lh /tmp/pack/dip-enterprise-latest.tgz
          sha256sum /tmp/pack/dip-enterprise-latest.tgz | tee /tmp/pack/dip-enterprise-latest.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dip-enterprise-latest-${{ github.sha }}
          path: |
            /tmp/pack/dip-enterprise-latest.tgz
            /tmp/pack/dip-enterprise-latest.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "## DIP Enterprise latest code uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`dip-enterprise-latest-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download from the Actions run Artifacts panel." >> "$GITHUB_STEP_SUMMARY"
