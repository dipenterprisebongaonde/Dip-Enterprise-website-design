name: CI Build

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare env
        run: |
          cp .env.example .env
          echo 'DATABASE_URL="file:./dev.db"' >> .env
          echo 'AUTH_SECRET="ci-build-secret-not-for-production"' >> .env

      - name: Prisma generate + db push
        run: |
          npx prisma generate
          npx prisma db push

      - name: Production build
        run: npm run build
